<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ-панель — Forest Tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Montserrat+Alternates:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a1410;
      --surface: rgba(20, 35, 25, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #337B57;
      --accent-hover: #2a6346;
      --text: #fff;
      --text-secondary: rgba(255,255,255,0.6);
      --danger: #ff5050;
      --warning: #f4a742;
      --radius: 16px;
      --transition: 0.2s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .admin-container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: rgba(10, 20, 15, 0.9);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .sidebar-logo {
      font-family: 'Montserrat Alternates', sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 40px;
      text-align: center;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: all var(--transition);
      cursor: pointer;
    }

    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-item.active { background: rgba(51, 123, 87, 0.2); color: var(--accent); }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }

    .page-title {
      font-family: 'Montserrat Alternates', sans-serif;
      font-size: 28px;
      margin-bottom: 24px;
      color: var(--text);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 600;
      color: var(--accent);
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      display: none;
    }

    .panel.active { display: block; }

    .section-title {
      font-family: 'Montserrat Alternates', sans-serif;
      font-size: 20px;
      margin-bottom: 16px;
    }

    .table-wrapper { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    th, td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    th { color: var(--text-secondary); font-weight: 500; }
    td { color: var(--text); }

    .btn {
      padding: 10px 20px;
      border-radius: 100px;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { background: rgba(255,255,255,0.05); }
    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .btn-danger:hover { background: rgba(255,80,80,0.1); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* Формы */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition);
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 80px; }

    /* Исправление выпадающих списков */
    select.form-select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 16px center;
      background-size: 16px;
    }

    select.form-select option {
      background: #1a2a1a;
      color: #fff;
    }

    /* Множественный выбор */
    select[multiple].form-select {
      background-image: none;
      height: auto;
      padding: 8px;
    }

    select[multiple].form-select option {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      background: rgba(0,0,0,0.3);
      color: #ccc;
    }

    select[multiple].form-select option:checked {
      background: var(--accent);
      color: white;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      display: inline-block;
    }

    .badge-success { background: rgba(51, 123, 87, 0.2); color: var(--accent); }
    .badge-warning { background: rgba(244, 167, 66, 0.2); color: var(--warning); }
    .badge-danger { background: rgba(255, 80, 80, 0.2); color: var(--danger); }

    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--bg);
    }

    .login-card {
      background: var(--surface);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      width: 400px;
      text-align: center;
    }

    .login-title {
      font-family: 'Montserrat Alternates', sans-serif;
      font-size: 24px;
      margin-bottom: 24px;
    }

    .hidden { display: none !important; }

    /* Загрузка изображений */
    .image-upload-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .image-upload-box {
      flex: 1;
      min-width: 150px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .image-upload-box:hover { border-color: var(--accent); }

    .image-upload-box img {
      max-width: 100%;
      max-height: 150px;
      object-fit: contain;
      margin-top: 8px;
    }

    .image-upload-box .placeholder {
      color: var(--text-secondary);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-title">Вход в админ-панель</div>
      <div class="form-group"><input type="text" class="form-input" id="loginInput" placeholder="Логин (admin)" value="admin"></div>
      <div class="form-group"><input type="password" class="form-input" id="passwordInput" placeholder="Пароль (admin123)"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="login()">Войти</button>
      <p style="margin-top:12px;font-size:12px;color:var(--text-secondary);">Демо: admin / admin123</p>
    </div>
  </div>

  <div class="admin-container hidden" id="adminContainer">
    <aside class="sidebar">
      <div class="sidebar-logo">Forest Tea</div>
      <nav>
        <a class="nav-item active" data-panel="dashboard" onclick="switchPanel('dashboard')">Дашборд</a>
        <a class="nav-item" data-panel="products" onclick="switchPanel('products')">Товары</a>
        <a class="nav-item" data-panel="orders" onclick="switchPanel('orders')">Заказы</a>
        <a class="nav-item" data-panel="users" onclick="switchPanel('users')">Пользователи</a>
        <a class="nav-item" data-panel="reviews" onclick="switchPanel('reviews')">Отзывы</a>
      </nav>
      <div style="margin-top:auto;">
        <a class="nav-item" onclick="logout()" style="color: var(--danger);">Выйти</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="panel active" id="panel-dashboard">
        <h1 class="page-title">Дашборд</h1>
        <div class="dashboard-grid" id="dashboardStats"></div>
        <div class="panel" style="display:block;">
          <h2 class="section-title">Последние заказы</h2>
          <div class="table-wrapper" id="recentOrdersTable"></div>
        </div>
      </div>

      <div class="panel" id="panel-products">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <h1 class="page-title" style="margin:0;">Товары</h1>
          <button class="btn btn-primary" onclick="openProductForm()">+ Добавить товар</button>
        </div>
        <div class="table-wrapper" id="productsTable"></div>
      </div>

      <div class="panel" id="panel-orders">
        <h1 class="page-title">Заказы</h1>
        <div class="table-wrapper" id="ordersTable"></div>
      </div>

      <div class="panel" id="panel-users">
        <h1 class="page-title">Пользователи</h1>
        <div class="table-wrapper" id="usersTable"></div>
      </div>

      <div class="panel" id="panel-reviews">
        <h1 class="page-title">Отзывы</h1>
        <div class="table-wrapper" id="reviewsTable"></div>
      </div>

      <!-- Модальное окно товара -->
      <div class="hidden" id="productModal">
        <div style="background:var(--surface);border-radius:var(--radius);padding:24px;max-width:800px;margin:0 auto;max-height:90vh;overflow-y:auto;">
          <h2 class="section-title" id="modalTitle">Добавить товар</h2>

          <div class="form-group">
            <label class="form-label">Название</label>
            <input class="form-input" id="prodName">
          </div>
          <div class="form-group">
            <label class="form-label">Категория</label>
            <select class="form-select" id="prodCategory">
              <option>Зелёный чай</option><option>Чёрный чай</option><option>Травяной чай</option>
              <option>Улун</option><option>Пуэр</option><option>Белый чай</option><option>Матча</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Цена (Br)</label>
            <input type="number" class="form-input" id="prodPrice">
          </div>

          <h3 class="section-title" style="font-size:16px;margin-top:16px;">Изображения</h3>
          <div class="image-upload-group">
            <div class="image-upload-box" onclick="document.getElementById('prodImage1').click()">
              <div class="placeholder" id="preview1Placeholder">Основное фото</div>
              <img id="preview1" style="display:none;">
              <input type="file" id="prodImage1" accept="image/*" onchange="previewImage(this, 'preview1', 'preview1Placeholder')" hidden>
            </div>
            <div class="image-upload-box" onclick="document.getElementById('prodImage2').click()">
              <div class="placeholder" id="preview2Placeholder">Доп. фото</div>
              <img id="preview2" style="display:none;">
              <input type="file" id="prodImage2" accept="image/*" onchange="previewImage(this, 'preview2', 'preview2Placeholder')" hidden>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Краткое описание (для карточки)</label>
            <textarea class="form-textarea" id="prodShortDesc"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Полное описание (для страницы товара)</label>
            <textarea class="form-textarea" id="prodFullDesc" style="min-height:120px;"></textarea>
          </div>

          <h3 class="section-title" style="font-size:16px;margin-top:16px;">Характеристики</h3>
          <div class="form-group"><label class="form-label">Вид чая</label><input class="form-input" id="prodTeaType" placeholder="например, Матча"></div>
          <div class="form-group"><label class="form-label">Температура воды</label><input class="form-input" id="prodTemp" placeholder="например, 70–80°C"></div>
          <div class="form-group"><label class="form-label">Время заваривания</label><input class="form-input" id="prodTime" placeholder="например, взбивать 30–60 сек"></div>
          <div class="form-group"><label class="form-label">Срок хранения</label><input class="form-input" id="prodShelf" placeholder="например, 12 месяцев"></div>

          <h3 class="section-title" style="font-size:16px;margin-top:16px;">Фильтры и теги</h3>
          <div class="form-group">
            <label class="form-label">Страна</label>
            <select class="form-select" id="prodCountry">
              <option value="">-- Не выбрана --</option>
              <option>Китай</option><option>Япония</option><option>Индия</option>
              <option>Тайвань</option><option>Шри-Ланка</option><option>Вьетнам</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Вкус (можно несколько)</label>
            <select class="form-select" id="prodTaste" multiple size="5">
              <option>Цветочный</option><option>Фруктовый</option><option>Землистый</option>
              <option>Ореховый</option><option>Сливочный</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Уровень кофеина</label>
            <select class="form-select" id="prodCaffeine">
              <option value="">-- Не указан --</option>
              <option>Высокий</option><option>Средний</option><option>Низкий</option><option>Без кофеина</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Класс чая</label>
            <select class="form-select" id="prodClass">
              <option value="">-- Не указан --</option>
              <option>Органический</option><option>Церемониальный</option>
              <option>Премиум</option><option>Классический</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Год сбора</label>
            <select class="form-select" id="prodYear">
              <option value="">-- Не указан --</option>
              <option>2026 (свежий)</option><option>2025</option><option>2024</option><option>Выдержанный (старше)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Рейтинг (1-5)</label>
            <input type="number" class="form-input" id="prodRating" min="0" max="5" step="0.1" value="0">
          </div>

          <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px;">
            <button class="btn btn-outline" onclick="closeProductForm()">Отмена</button>
            <button class="btn btn-primary" id="saveProductBtn">Сохранить</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
  // ======================== ХРАНИЛИЩЕ ИЗОБРАЖЕНИЙ ========================
  const imageCache1 = {};
  const imageCache2 = {};

  // Чтение файла в base64
  function readFile(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  // Превью изображения (вызывается из onclick)
  window.previewImage = function(input, imgId, placeholderId) {
    const img = document.getElementById(imgId);
    const placeholder = document.getElementById(placeholderId);
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = (e) => {
        img.src = e.target.result;
        img.style.display = 'block';
        placeholder.style.display = 'none';
      };
      reader.readAsDataURL(input.files[0]);
    }
  };

  // ======================== ДАННЫЕ ========================
  const defaultProducts = [
    {
      id:1, name:'Горная матча', category:'Матча', price:32,
      shortDesc:'Премиальный порошковый чай высшего качества',
      fullDesc:'Церемониальная матча из префектуры Удзи.',
      teaType:'Матча', temp:'70–80°C', time:'взбивать 30–60 сек', shelf:'12 месяцев',
      country:'Япония', taste:['Травянистый','Сливочный'], caffeine:'Высокий', class:'Церемониальный', year:'2024', rating:4.2,
      image1: '', image2: ''
    },
    {
      id:2, name:'Молочный улун', category:'Улун', price:42,
      shortDesc:'Нежный чай с карамельным ароматом',
      fullDesc:'Тайваньский улун с натуральным молочным вкусом.',
      teaType:'Улун', temp:'85–90°C', time:'2–4 мин', shelf:'18 месяцев',
      country:'Тайвань', taste:['Сливочный','Цветочный'], caffeine:'Средний', class:'Премиум', year:'2024', rating:4.5,
      image1: '', image2: ''
    }
  ];

  const defaultOrders = [
    { id:'#2468', customer:'Анна', items:'Горная матча ×2', total:70, status:'delivered', date:'15.03.2026' },
    { id:'#2401', customer:'Михаил', items:'Молочный улун ×1', total:42, status:'processing', date:'02.03.2026' }
  ];

  const defaultUsers = [
    { name:'Анна', email:'anna@mail.ru', registered:'10.01.2026', orders:5, blocked:false },
    { name:'Михаил', email:'mike@mail.ru', registered:'15.02.2026', orders:2, blocked:false }
  ];

  const defaultReviews = [
    { id:1, author:'Анна', product:'Горная матча', rating:5, text:'Лучшая матча!', approved:true },
    { id:2, author:'Михаил', product:'Молочный улун', rating:4, text:'Хороший чай', approved:false }
  ];

  function getData(key, defaultVal) {
    const saved = localStorage.getItem('forest_'+key);
    return saved ? JSON.parse(saved) : defaultVal;
  }

  function saveData(key, val) {
    localStorage.setItem('forest_'+key, JSON.stringify(val));
    renderAll();
  }

  let products = getData('products', defaultProducts);
  let orders   = getData('orders', defaultOrders);
  let users    = getData('users', defaultUsers);
  let reviews  = getData('reviews', defaultReviews);
  let editingProductId = null;

  // ======================== АВТОРИЗАЦИЯ ========================
  function login() {
    if (document.getElementById('loginInput').value==='admin' && document.getElementById('passwordInput').value==='admin123') {
      sessionStorage.setItem('admin_auth','true');
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminContainer').classList.remove('hidden');
      renderAll();
    } else alert('Неверный логин или пароль');
  }

  function logout() { sessionStorage.removeItem('admin_auth'); location.reload(); }

  if (sessionStorage.getItem('admin_auth')==='true') {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminContainer').classList.remove('hidden');
  }

  // ======================== НАВИГАЦИЯ ========================
  function switchPanel(name) {
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+name).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.querySelector(`[data-panel="${name}"]`).classList.add('active');
    if(name==='dashboard') renderDashboard();
  }

  function renderAll() {
    renderDashboard();
    renderProducts();
    renderOrders();
    renderUsers();
    renderReviews();
  }

  // ======================== ОТОБРАЖЕНИЕ ========================
  function renderDashboard() {
    document.getElementById('dashboardStats').innerHTML = `
      <div class="stat-card"><div class="stat-value">${products.length}</div><div class="stat-label">Товаров</div></div>
      <div class="stat-card"><div class="stat-value">${orders.length}</div><div class="stat-label">Заказов</div></div>
      <div class="stat-card"><div class="stat-value">${users.length}</div><div class="stat-label">Пользователей</div></div>
      <div class="stat-card"><div class="stat-value">${reviews.filter(r=>r.approved).length}</div><div class="stat-label">Одобрено отзывов</div></div>
    `;
    document.getElementById('recentOrdersTable').innerHTML = `
      <table><thead><tr><th>ID</th><th>Клиент</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>
      ${orders.slice(-5).reverse().map(o=>`
        <tr><td>${o.id}</td><td>${o.customer}</td><td>${o.total} Br</td>
        <td><span class="badge badge-${o.status==='delivered'?'success':'warning'}">${o.status}</span></td></tr>
      `).join('')}
      </tbody></table>`;
  }

  function renderProducts() {
    const rows = products.map(p=>`
      <tr>
        <td>${p.name}</td><td>${p.category}</td><td>${p.price} Br</td>
        <td>${p.country||''}</td><td>${Array.isArray(p.taste)?p.taste.join(', '):p.taste||''}</td>
        <td>${p.caffeine||''}</td><td>${p.class||''}</td><td>${p.year||''}</td>
        <td>${p.rating||0}</td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="editProduct(${p.id})">Редактировать</button>
          <button class="btn btn-sm btn-outline" onclick="deleteProduct(${p.id})">Удалить</button>
        </td>
      </tr>
    `).join('');
    document.getElementById('productsTable').innerHTML = `
      <table><thead><tr><th>Название</th><th>Категория</th><th>Цена</th><th>Страна</th><th>Вкус</th><th>Кофеин</th><th>Класс</th><th>Год</th><th>Рейтинг</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function renderOrders() {
    const statuses = {delivered:'Доставлен',processing:'В обработке',cancelled:'Отменён'};
    document.getElementById('ordersTable').innerHTML = `
      <table><thead><tr><th>ID</th><th>Клиент</th><th>Товары</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>
      ${orders.map(o=>`
        <tr><td>${o.id}</td><td>${o.customer}</td><td>${o.items}</td><td>${o.total} Br</td>
        <td><select onchange="updateOrderStatus('${o.id}',this.value)" style="background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;padding:4px 8px;color:white;">
          ${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}
        </select></td></tr>
      `).join('')}
      </tbody></table>`;
  }

  function renderUsers() {
    document.getElementById('usersTable').innerHTML = `
      <table><thead><tr><th>Имя</th><th>Email</th><th>Дата регистрации</th><th>Заказов</th><th></th></tr></thead><tbody>
      ${users.map(u=>`
        <tr><td>${u.name}</td><td>${u.email}</td><td>${u.registered}</td><td>${u.orders}</td>
        <td><button class="btn btn-sm ${u.blocked?'btn-danger':'btn-outline'}" onclick="toggleBlockUser('${u.email}')">${u.blocked?'Разблокировать':'Заблокировать'}</button></td></tr>
      `).join('')}
      </tbody></table>`;
  }

  function renderReviews() {
    document.getElementById('reviewsTable').innerHTML = `
      <table><thead><tr><th>Автор</th><th>Товар</th><th>Оценка</th><th>Текст</th><th></th></tr></thead><tbody>
      ${reviews.map(r=>`
        <tr><td>${r.author}</td><td>${r.product}</td><td>${'★'.repeat(r.rating)}</td><td>${r.text}</td>
        <td><button class="btn btn-sm ${r.approved?'btn-outline':'btn-primary'}" onclick="toggleApproveReview(${r.id})">${r.approved?'Скрыть':'Одобрить'}</button></td></tr>
      `).join('')}
      </tbody></table>`;
  }

  // ======================== ФОРМА ТОВАРА ========================
  async function openProductForm(id=null) {
    editingProductId = id;
    // Сбрасываем файловые инпуты
    document.getElementById('prodImage1').value = '';
    document.getElementById('prodImage2').value = '';

    if (id) {
      const p = products.find(x=>x.id===id);
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodCategory').value = p.category;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodShortDesc').value = p.shortDesc||'';
      document.getElementById('prodFullDesc').value = p.fullDesc||'';
      document.getElementById('prodTeaType').value = p.teaType||'';
      document.getElementById('prodTemp').value = p.temp||'';
      document.getElementById('prodTime').value = p.time||'';
      document.getElementById('prodShelf').value = p.shelf||'';
      document.getElementById('prodCountry').value = p.country||'';
      const tasteSelect = document.getElementById('prodTaste');
      Array.from(tasteSelect.options).forEach(opt => {
        opt.selected = p.taste && p.taste.includes(opt.value);
      });
      document.getElementById('prodCaffeine').value = p.caffeine||'';
      document.getElementById('prodClass').value = p.class||'';
      document.getElementById('prodYear').value = p.year||'';
      document.getElementById('prodRating').value = p.rating||0;

      // Превью изображений
      const preview1 = document.getElementById('preview1');
      const placeholder1 = document.getElementById('preview1Placeholder');
      if (p.image1) {
        preview1.src = p.image1;
        preview1.style.display = 'block';
        placeholder1.style.display = 'none';
      } else {
        preview1.src = '';
        preview1.style.display = 'none';
        placeholder1.style.display = 'block';
      }
      const preview2 = document.getElementById('preview2');
      const placeholder2 = document.getElementById('preview2Placeholder');
      if (p.image2) {
        preview2.src = p.image2;
        preview2.style.display = 'block';
        placeholder2.style.display = 'none';
      } else {
        preview2.src = '';
        preview2.style.display = 'none';
        placeholder2.style.display = 'block';
      }

      document.getElementById('modalTitle').textContent = 'Редактировать товар';
      document.getElementById('saveProductBtn').textContent = 'Обновить';
    } else {
      // Очистка всех полей
      ['prodName','prodPrice','prodShortDesc','prodFullDesc','prodTeaType','prodTemp','prodTime','prodShelf','prodCountry','prodCaffeine','prodClass','prodYear','prodRating'].forEach(id=>{
        document.getElementById(id).value = '';
      });
      document.getElementById('prodCategory').value = 'Зелёный чай';
      document.getElementById('prodRating').value = '0';
      Array.from(document.getElementById('prodTaste').options).forEach(o=>o.selected=false);
      document.getElementById('preview1').src = ''; document.getElementById('preview1').style.display = 'none';
      document.getElementById('preview1Placeholder').style.display = 'block';
      document.getElementById('preview2').src = ''; document.getElementById('preview2').style.display = 'none';
      document.getElementById('preview2Placeholder').style.display = 'block';
      document.getElementById('modalTitle').textContent = 'Добавить товар';
      document.getElementById('saveProductBtn').textContent = 'Добавить';
    }
    document.getElementById('productModal').classList.remove('hidden');
  }

  function closeProductForm() {
    document.getElementById('productModal').classList.add('hidden');
  }

  // ===== СОХРАНЕНИЕ ТОВАРА =====
  document.getElementById('saveProductBtn').addEventListener('click', async function() {
    const taste = Array.from(document.getElementById('prodTaste').selectedOptions).map(o=>o.value);

    // Читаем изображения напрямую из инпутов
    const file1 = document.getElementById('prodImage1').files[0];
    const file2 = document.getElementById('prodImage2').files[0];
    let image1 = '';
    let image2 = '';

    if (file1) image1 = await readFile(file1);
    if (file2) image2 = await readFile(file2);

    // Если редактируем и новый файл не выбран – берём старое
    if (editingProductId && !file1) {
      const old = products.find(p => p.id === editingProductId);
      if (old) image1 = old.image1 || '';
    }
    if (editingProductId && !file2) {
      const old = products.find(p => p.id === editingProductId);
      if (old) image2 = old.image2 || '';
    }

    const data = {
      name: document.getElementById('prodName').value,
      category: document.getElementById('prodCategory').value,
      price: parseFloat(document.getElementById('prodPrice').value),
      shortDesc: document.getElementById('prodShortDesc').value,
      fullDesc: document.getElementById('prodFullDesc').value,
      teaType: document.getElementById('prodTeaType').value,
      temp: document.getElementById('prodTemp').value,
      time: document.getElementById('prodTime').value,
      shelf: document.getElementById('prodShelf').value,
      country: document.getElementById('prodCountry').value,
      taste: taste.length>0 ? taste : undefined,
      caffeine: document.getElementById('prodCaffeine').value,
      class: document.getElementById('prodClass').value,
      year: document.getElementById('prodYear').value,
      rating: parseFloat(document.getElementById('prodRating').value) || 0,
      image1, image2
    };

    if (!data.name || !data.price) { alert('Название и цена обязательны'); return; }

    if (editingProductId) {
      const idx = products.findIndex(p=>p.id===editingProductId);
      products[idx] = { ...products[idx], ...data };
    } else {
      data.id = Math.max(...products.map(p=>p.id), 0) + 1;
      products.push(data);
    }
    saveData('products', products);
    closeProductForm();
  });

  // Остальные функции
  function editProduct(id) { openProductForm(id); }
  function deleteProduct(id) {
    if (confirm('Удалить товар?')) {
      products = products.filter(p=>p.id!==id);
      saveData('products', products);
    }
  }

  function updateOrderStatus(orderId, newStatus) {
    const order = orders.find(o=>o.id===orderId);
    if (order) { order.status = newStatus; saveData('orders', orders); }
  }

  function toggleBlockUser(email) {
    const user = users.find(u=>u.email===email);
    if (user) { user.blocked = !user.blocked; saveData('users', users); }
  }

  function toggleApproveReview(id) {
    const review = reviews.find(r=>r.id===id);
    if (review) { review.approved = !review.approved; saveData('reviews', reviews); }
  }

  // Первый рендер
  if (sessionStorage.getItem('admin_auth')==='true') renderAll();
</script>
